name: Publish accepted solve

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged solve PR to publish or retry
        required: true
        type: string

permissions:
  contents: write
  actions: read
  pull-requests: read
  statuses: read

concurrency:
  group: publish-accepted-solves
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python3 -m pip install -r scripts/requirements-content.txt
      - name: Authenticate the merged PR and protected Lean receipt
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]]
          python3 scripts/proposals/publish.py --pr "$PR"
      - name: Commit the derived acceptance, atlas, and leaderboard
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git add data leaderboard/credits.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Record accepted solution from PR #$PR"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          # A concurrent change causes a safe rejection; rerun publication from current main.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
